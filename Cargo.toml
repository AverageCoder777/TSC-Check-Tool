[package]
name = "TSC_Check_Tool"
version = "0.9.0"
edition = "2024"

[dependencies]
arboard = "3.7.0"
rfd = "0.18"
walkdir = "2.5"
rayon = "1.12"
zip = { version = "9", default-features = false, features = ["deflate"] }
regex = "1.13"
tempfile = "3.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.19.0"
glam = "0.30"
wgpu = "0.19.4"
pollster = "0.4"
chrono = "0.4"
xml = "1.4"
ddsfile = "0.6"
texture2ddecoder = "0.1.2"
bytemuck = { version = "1.25", features = ["derive"] }
encoding_rs = "0.8"
thiserror = "2"
memchr = "2"
open = "5"

[build-dependencies]
slint-build = "1.19.0"

#[profile.release]
#lto = true
#codegen-units = 1
#strip = true
